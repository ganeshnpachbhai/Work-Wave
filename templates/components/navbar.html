<nav class="navbar navbar-expand-lg ww-navbar sticky-top">
    <div class="container">
        <a class="ww-brand" href="{% url 'home' %}">
            <span class="ww-brand-icon">
                <i class="bi bi-briefcase-fill"></i>
            </span>
            <span>Work<span class="ww-brand-accent">Wave</span></span>
        </a>

        <button class="navbar-toggler border-0 shadow-none" type="button" data-bs-toggle="collapse" data-bs-target="#mainNav" aria-controls="mainNav" aria-expanded="false" aria-label="Toggle navigation">
            <i class="bi bi-list fs-2 text-dark"></i>
        </button>

        <div class="collapse navbar-collapse" id="mainNav">
            <ul class="navbar-nav ms-auto align-items-lg-center gap-lg-1 my-2 my-lg-0">
                <li class="nav-item">
                    <a class="nav-link ww-nav-link {% if request.resolver_match.url_name == 'home' %}active{% endif %}" href="{% url 'home' %}">
                        <i class="bi bi-house me-1"></i> Home
                    </a>
                </li>
                <li class="nav-item">
                    <a class="nav-link ww-nav-link {% if request.resolver_match.url_name == 'job_list' %}active{% endif %}" href="{% url 'job_list' %}">
                        <i class="bi bi-search me-1"></i> Find Jobs
                    </a>
                </li>

                {% if user.is_authenticated %}
                    {% if user.is_superuser or user.is_staff %}
                        <li class="nav-item">
                            <a class="nav-link ww-nav-link text-primary fw-semibold" href="{% if user.is_superuser %}{% url 'admin_dashboard' %}{% else %}/admin/{% endif %}">
                                <i class="bi bi-shield-lock me-1"></i> Admin Panel
                            </a>
                        </li>
                    {% endif %}

                    <li class="nav-item">
                        <a class="nav-link ww-nav-link {% if 'dashboard' in request.resolver_match.url_name %}active{% endif %}" href="{% url 'dashboard' %}">
                            <i class="bi bi-grid me-1"></i> Dashboard
                        </a>
                    </li>

                    <li class="nav-item ms-lg-2">
                        <form method="post" action="{% url 'logout' %}" data-csrf-token-url="{% url 'csrf_token' %}" class="d-inline">
                            {% csrf_token %}
                            <button class="btn btn-outline-secondary btn-sm px-3" type="submit">
                                <i class="bi bi-box-arrow-right me-1"></i> Logout
                            </button>
                        </form>
                    </li>
                {% else %}
                    <li class="nav-item ms-lg-2">
                        <a class="nav-link ww-nav-link" href="{% url 'login' %}">
                            <i class="bi bi-person me-1"></i> Login
                        </a>
                    </li>
                    <li class="nav-item ms-lg-2">
                        <a class="btn btn-primary btn-sm px-3" href="{% url 'signup' %}">
                            Get Started <i class="bi bi-arrow-right ms-1"></i>
                        </a>
                    </li>
                {% endif %}
            </ul>
        </div>
    </div>
</nav>
